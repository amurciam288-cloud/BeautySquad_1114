{% extends "base.html" %}
{% block page %}bookings{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Reserva una cita</h1>
  <p>Inicia sesión, elige un servicio y selecciona un horario disponible.</p>
  <form data-booking-form>
    <label>Servicio <select name="service_id" data-services required><option value="">Cargando servicios...</option></select></label>
    <label>Horario <select name="slot" data-slots required><option value="">Cargando horarios...</option></select></label>
    <button class="button">Confirmar reserva</button>
  </form>
  <section class="appointments" data-my-appointments hidden>
    <h2>Mis citas</h2>
    <ul data-appointments-list></ul>
  </section>
</section>
{% endblock %}
