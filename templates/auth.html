{% extends "base.html" %}
{% block page %}auth{% endblock %}
{% block content %}
<section class="form-card">
  {% if mode == "login" %}
  <h1>Iniciar sesión</h1>
  <form data-auth-form data-mode="login">
    <label>Correo <input name="email" type="email" required></label>
    <label>Contraseña <input name="password" type="password" required></label>
    <button class="button">Ingresar</button>
  </form>
  <p>¿No tienes cuenta? <a href="/register">Regístrate</a>.</p>
  {% else %}
  <h1>Crear cuenta</h1>
  <form data-auth-form data-mode="register">
    <label>Nombre <input name="name" required></label>
    <label>Correo <input name="email" type="email" required></label>
    <label>Contraseña <input name="password" type="password" minlength="6" required></label>
    <button class="button">Registrarme</button>
  </form>
  <p>¿Ya tienes cuenta? <a href="/login">Ingresa</a>.</p>
  {% endif %}
</section>
{% endblock %}
